<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><meta name="description" content="Unsettled — a live material study by lifeafterlogic."><title>Unsettled — lifeafterlogic</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap');
:root{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;--gutter:clamp(18px,2.45vw,48px);color:#000;background:#101116;font-synthesis:none;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{--dock-height:76px}
#stage{position:fixed;inset:0 0 var(--dock-height);opacity:0;transition:opacity .7s;overflow:hidden;isolation:isolate}#stage.ready{opacity:1}canvas{display:block;width:100%;height:100%;touch-action:none}
#status{position:fixed;inset:0 0 var(--dock-height);display:grid;place-items:center;text-align:center;padding:24px;color:#c0c1c3;font-size:13px}#status[hidden]{display:none}
#controls{position:fixed;z-index:5;inset:auto 0 0;color:#000;font-size:13px;line-height:1.3}
.dock{display:grid;grid-template-columns:minmax(140px,1fr) auto auto;align-items:center;gap:clamp(20px,3vw,52px);padding:14px var(--gutter) calc(14px + env(safe-area-inset-bottom,0px));background:#fff;border-top:1px solid #000;min-height:76px}
.identity{display:flex;align-items:center;gap:12px;min-width:0}.mark{width:25px;height:25px;flex:none}.mark svg{display:block;width:100%;height:100%}
.wordmark{font-family:"Poppins","Helvetica Neue",sans-serif;font-size:22px;font-weight:700;letter-spacing:-1.2px;line-height:1.1;white-space:nowrap}.identity small{display:block;color:#666;font-size:11px;letter-spacing:-.1px;margin-top:4px}
.public-fields{display:flex;align-items:center;gap:clamp(22px,3vw,48px)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}.field>span:first-child,.field-top>span:first-child{color:#666;font-size:11px;letter-spacing:-.1px}
.field-top{display:flex;align-items:center;justify-content:space-between;gap:14px}output{font-variant-numeric:tabular-nums;color:#000;font-size:12px}
#particleCount{appearance:none;width:clamp(110px,15vw,215px);height:18px;background:transparent;margin:0;cursor:pointer}
#particleCount::-webkit-slider-runnable-track{height:1px;background:#000}#particleCount::-moz-range-track{height:1px;background:#000}
#particleCount::-webkit-slider-thumb{appearance:none;width:9px;height:13px;background:#000;border:0;border-radius:0;margin-top:-6px}#particleCount::-moz-range-thumb{width:9px;height:13px;background:#000;border:0;border-radius:0}
.palette-line{display:flex;align-items:center;gap:7px}#paletteSwatch{width:24px;height:11px;background:#283d85;flex:none;border:1px solid #0001}
select{font:inherit;color:#000;background:#fff;border:0;border-bottom:1px solid #000;padding:0 3px 2px 0;cursor:pointer;max-width:110px;border-radius:0}
.actions{display:flex;align-items:center;gap:9px}button{font:inherit;border:0;background:transparent;color:#000;padding:0;min-height:32px;cursor:pointer;white-space:nowrap}
button:hover{opacity:.5}button.icon{display:grid;place-items:center;width:32px;height:36px}button svg{width:18px;height:18px;display:block}
#pause .play-icon{display:none}#pause.is-paused .pause-icon{display:none}#pause.is-paused .play-icon{display:block}
#labToggle{margin-left:5px;border-bottom:1px solid transparent;min-height:28px}#labToggle[aria-expanded=true]{border-color:#000}
:focus-visible{outline:1px solid currentColor;outline-offset:5px}
.lab-panel{display:none;position:absolute;right:var(--gutter);bottom:calc(100% + 10px);background:#fff;border:1px solid #000;padding:16px;gap:12px 18px;align-items:center;flex-wrap:wrap;max-width:min(680px,calc(100vw - 2 * var(--gutter)));font-size:12px}
body.lab .lab-panel{display:flex}.lab-panel label{display:flex;align-items:center;gap:7px}.lab-panel button{border-bottom:1px solid #000;min-height:24px}#brightness{width:75px;accent-color:#000}#diagnostic{color:#666;font:10px/1.4 monospace}
body.clean #controls{display:none}body.clean #stage,body.clean #status{bottom:0}
@media(max-width:780px){body{--dock-height:128px}.dock{grid-template-columns:1fr auto;gap:10px 12px;padding:11px var(--gutter) calc(11px + env(safe-area-inset-bottom,0px))}.identity{grid-column:1;grid-row:1}.actions{grid-column:2;grid-row:1;gap:5px}.public-fields{grid-column:1/-1;grid-row:2;gap:16px;justify-content:space-between}.field:first-child{flex:1}#particleCount{width:100%}.wordmark{font-size:20px}.identity small{font-size:10px}.lab-panel{max-height:38vh;overflow:auto}button.icon{width:28px}.mark{width:22px;height:22px}}
@media(max-width:350px){.dock{gap:9px;padding-inline:10px}.identity{gap:6px}.mark{width:18px;height:18px}.wordmark{font-size:18px}.actions{gap:2px}.public-fields{gap:10px}#paletteSwatch{display:none}}
@media(prefers-reduced-motion:reduce){#stage{transition:none}}
</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.176.0/build/three.module.js","three/webgpu":"https://cdn.jsdelivr.net/npm/three@0.176.0/build/three.webgpu.js","three/tsl":"https://cdn.jsdelivr.net/npm/three@0.176.0/build/three.tsl.js","three/examples/jsm/":"https://cdn.jsdelivr.net/npm/three@0.176.0/examples/jsm/"}}</script></head>
<body><div id="stage"></div><div id="status" role="status">Loading study…</div>
<div id="controls" aria-label="Unsettled controls"><div class="lab-panel"><label>Shape <select id="shape"><option value="rods" selected>Cuboid</option><option value="capsules">Capsule</option><option value="spheres">Sphere</option></select></label><label>Colour rule <select id="color"><option value="0" selected>density</option><option value="1">speed + density</option><option value="0.5">balanced</option></select></label><label>Lighting <select id="lighting"><option value="sculptural">sculptural</option><option value="gloss">gloss studio</option><option value="studio">studio</option><option value="contrast">contrast</option><option value="spectral">spectral</option></select></label><label>Brightness <input id="brightness" type="range" min=".65" max="1.55" value="1.15" step=".05"><output id="brightnessLabel">115%</output></label><label>Solver <select id="solver"><option value="fast">fast</option><option value="classic">classic</option></select></label><label>Field shadows <select id="fieldShadow"><option value="deep">deep</option><option value="soft">soft</option><option value="off">off</option></select></label><label>Mesh shadows <select id="shadows"><option value="auto">auto</option><option value="on">on</option><option value="off">off</option></select></label><label><input type="checkbox" id="nerves"> Signals</label><label><input type="checkbox" id="learn"> Learning</label><button id="rare">Phenomenon</button><button id="reset">Reset learning</button><span id="diagnostic"></span><span>Coverage: <output id="coverageReadout">—</output></span><span>Regional updates: <output id="regionalReadout">0</output></span></div>
<footer class="dock"><div class="identity"><span class="mark" aria-hidden="true"><svg viewBox="0 0 7 7"><path fill="currentColor" d="M0 0H2V5H7V7H0ZM3 0H7V4H5V2H3Z"/></svg></span><div><div class="wordmark">unsettled</div><small>Experiment / 01</small></div></div>
<div class="public-fields"><label class="field"><span class="field-top"><span>Particles</span><output id="particleCountLabel" for="particleCount">300,000</output></span><input id="particleCount" type="range" min="5000" max="300000" step="1000" value="300000" aria-label="Particle count"></label><label class="field"><span>Colour <span id="studyName" hidden>Cobalt</span></span><span class="palette-line"><span id="paletteSwatch" aria-hidden="true"></span><select id="palette"><option value="0">Cobalt</option><option value="1">Petrol</option><option value="2">Verdigris</option><option value="3">Iris</option><option value="4">Ice</option><option value="5">Brass</option><option value="6">Prism</option><option value="7">Lime</option><option value="8">Copper</option></select></span></label><label class="field"><span>Material</span><select id="finish"><option value="metallic" selected>Metal</option><option value="glossy">Lacquer</option><option value="matte">Matte</option></select></label></div>
<div class="actions"><button class="icon" id="pause" title="Pause / resume" aria-label="Pause" aria-pressed="false"><span class="pause-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M9 5v14M15 5v14"/></svg></span><span class="play-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M8 5l11 7-11 7Z"/></svg></span></button><button class="icon" id="new" title="New study" aria-label="New study"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M20 9a8 8 0 1 0 .1 6M20 4v5h-5"/></svg></button><button class="icon" id="full" title="Fullscreen" aria-label="Fullscreen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/></svg></button><button id="labToggle" aria-label="Technical controls" aria-expanded="false">Lab</button></div></footer></div><script type="module" src="./src/main.js"></script></body></html>
