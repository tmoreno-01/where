<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101116"><title>Matter — Lifeafterlogic</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101116;color:#f2f2f0;font:12px/1.4 Arial,Helvetica,sans-serif}
#stage{position:fixed;inset:0;opacity:0;transition:opacity .7s;overflow:hidden;isolation:isolate}#stage.ready{opacity:1}canvas{display:block;width:100%;height:100%;touch-action:none}
#status{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:#c0c1c3}#status[hidden]{display:none}
#controls{position:fixed;z-index:5;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px)}
.dock{display:flex;align-items:stretch;background:#111216ef;border:1px solid #ffffff26;border-radius:8px;box-shadow:0 5px 24px #0005;overflow:hidden}
.identity{padding:10px 17px;min-width:136px;display:flex;flex-direction:column;justify-content:center;border-right:1px solid #ffffff1a}
.wordmark{font-size:16px;font-weight:600;letter-spacing:-.045em;line-height:1}.identity small{color:#a1a4ad;font-size:10px;margin-top:5px;white-space:nowrap}
.public-fields{display:flex;align-items:center;gap:18px;padding:9px 15px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}.field>span:first-child,.field-top>span:first-child{font-size:9px;letter-spacing:.085em;text-transform:uppercase;color:#9c9fa7}
.field-top{display:flex;align-items:center;justify-content:space-between;gap:12px}output{font-size:11px;font-variant-numeric:tabular-nums;color:#f3f3ef}
#particleCount{width:145px;max-width:24vw;margin:2px 0;accent-color:#d7e3e5;cursor:pointer}
select{background:#111216;color:#e9e9e6;font:inherit;border:0;padding:0 12px 0 0;max-width:120px;cursor:pointer;outline-offset:3px}
.actions{display:flex;align-items:center;border-left:1px solid #ffffff1a;padding:6px;gap:2px}button{border:0;background:transparent;color:#c8cad0;cursor:pointer;font:inherit;border-radius:4px;min-height:32px;padding:7px 9px;white-space:nowrap}
button:hover{background:#ffffff12;color:#fff}button.icon{font-size:17px;width:34px;padding:0}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #c8dbe1;outline-offset:2px}
#rare{color:#f1f0ed;font-size:11px}#labToggle{color:#a1a4ad;font-size:10px}
.lab-panel{display:none;background:#111216f5;border:1px solid #ffffff26;border-radius:6px;margin-bottom:7px;padding:12px;gap:10px 16px;align-items:center;flex-wrap:wrap;max-width:760px}
body.lab .lab-panel{display:flex}.lab-panel label{display:flex;align-items:center;gap:6px;font-size:11px;color:#b4b7bf}.lab-panel select{border-bottom:1px solid #555b65}
#brightness{width:80px;accent-color:#d7e3e5}#diagnostic{color:#9da0a8;font:10px/1.4 monospace}
body.clean #controls{display:none}
@media(max-width:720px){#controls{max-width:calc(100% - 20px);bottom:max(10px,env(safe-area-inset-bottom));width:min(490px,calc(100% - 20px))}.dock{flex-wrap:wrap}.identity{min-width:100%;padding:8px 11px;flex-direction:row;align-items:center;justify-content:space-between;border-right:0;border-bottom:1px solid #ffffff1a}.identity small{margin:0}.public-fields{flex:1;gap:12px;padding:9px 11px}.field{flex:1}#particleCount{width:100%;max-width:none}.actions{border-left:0;border-top:1px solid #ffffff1a;width:100%;justify-content:flex-end;padding:3px 6px}.lab-panel{max-height:36vh;overflow:auto}select{max-width:100px}}
@media(prefers-reduced-motion:reduce){#stage{transition:none}}
</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.176.0/build/three.module.js","three/webgpu":"https://cdn.jsdelivr.net/npm/three@0.176.0/build/three.webgpu.js","three/tsl":"https://cdn.jsdelivr.net/npm/three@0.176.0/build/three.tsl.js","three/examples/jsm/":"https://cdn.jsdelivr.net/npm/three@0.176.0/examples/jsm/"}}</script></head>
<body><div id="stage"></div><div id="status" role="status">Initialising live material…</div>
<div id="controls" aria-label="Matter experiment controls">
<div class="lab-panel"><label>Shape <select id="shape"><option value="capsules">capsules</option><option value="spheres">spheres</option><option value="rods">cuboids</option></select></label><label>Colour rule <select id="color"><option value="0" selected>density</option><option value="1">speed + density</option><option value="0.5">balanced</option></select></label><label>Lighting <select id="lighting"><option value="sculptural">sculptural</option><option value="gloss">gloss studio</option><option value="studio">studio</option><option value="contrast">contrast</option><option value="spectral">spectral</option></select></label><label>Brightness <input id="brightness" type="range" min=".65" max="1.55" value="1.15" step=".05"><output id="brightnessLabel">115%</output></label><label>Solver <select id="solver"><option value="fast">fast</option><option value="classic">classic</option></select></label><label>Field shadows <select id="fieldShadow"><option value="deep">deep</option><option value="soft">soft</option><option value="off">off</option></select></label><label>Mesh shadows <select id="shadows"><option value="auto">auto</option><option value="on">on</option><option value="off">off</option></select></label><label><input type="checkbox" id="nerves"> Signals</label><label><input type="checkbox" id="learn"> Learning</label><button id="reset">Reset learning</button><span id="diagnostic"></span><span>Occupied tiles: <output id="coverageReadout">—</output></span></div>
<div class="dock"><div class="identity"><span class="wordmark">matter<span style="color:#8c9199">.</span></span><small><span id="publicState">awakening</span> / <span id="studyName">titanium</span></small></div>
<div class="public-fields"><label class="field"><span class="field-top"><span>Particles</span><output id="particleCountLabel" for="particleCount">300,000</output></span><input id="particleCount" type="range" min="5000" max="750000" step="1000" value="300000" aria-label="Particle count"></label><label class="field"><span>Colour</span><select id="palette"><option value="-1">evolving</option><option value="0">titanium</option><option value="1">oil slick</option><option value="2">oxidised</option><option value="3">ultraviolet</option><option value="4">glacier</option><option value="5">black gold</option><option value="6">spectrum</option><option value="7">acid</option><option value="8">ember</option></select></label><label class="field"><span>Material</span><select id="finish"><option value="glossy">glossy</option><option value="metallic">metallic</option><option value="matte">matte</option></select></label></div>
<div class="actions"><button id="rare">Phenomenon</button><button class="icon" id="pause" title="Pause / resume" aria-label="Pause" aria-pressed="false"><span class="pause-icon">Ⅱ</span></button><button class="icon" id="new" title="New field" aria-label="New field">↻</button><button class="icon" id="full" title="Fullscreen" aria-label="Fullscreen">⛶</button><button id="labToggle" aria-label="Technical controls" aria-expanded="false">Lab</button></div></div></div><script type="module" src="./src/main.js"></script></body></html>
