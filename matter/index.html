<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101116"><title>Where — Matter 008</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101116;color:#d9d9d6;font:12px/1.4 Arial,Helvetica,sans-serif}#stage{position:fixed;inset:0;opacity:0;transition:opacity .8s}#stage.ready{opacity:1}canvas{display:block;width:100%;height:100%;touch-action:none}#status{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:28px;color:#b6b7ba;font-size:13px}#status[hidden]{display:none}#controls{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));left:22px;right:22px;display:flex;align-items:center;justify-content:space-between;letter-spacing:.08em;font-size:11px}#controls button{color:inherit;border:0;background:none;padding:10px;cursor:pointer;font:inherit}#controls button:hover{color:white}body.clean #controls{display:none}@media(max-width:450px){#controls{left:10px;right:10px}#controls button{padding:7px}}#controls{flex-wrap:wrap;gap:7px;background:rgba(12,14,20,.82);padding:8px 12px;border-radius:7px;backdrop-filter:blur(10px);z-index:4}#controls select{font:inherit;color:inherit;background:#242731;border:1px solid #454952;border-radius:4px;padding:5px}#controls label{display:inline-flex;align-items:center;gap:4px}#controls .settings{display:flex;align-items:center;flex-wrap:wrap;gap:9px}#diagnostic{font-size:10px;color:#a7acb5}body.clean #controls{display:none}</style>

<body><div id="stage"></div><div id="status" role="status">Preparing the material field…</div><div id="controls"><div class="settings"><span>matter 008</span><label>shape <select id="shape"><option value="capsules">capsules</option><option value="spheres">spheres</option><option value="rods">cuboids</option></select></label><label>palette <select id="palette"><option value="0">spectrum</option><option value="1">acid</option><option value="2">ember</option></select></label><label>colour <select id="color"><option value="1">speed + density</option><option value="0">density</option><option value="0.5">balanced</option></select></label><label>lighting <select id="lighting"><option value="studio">studio</option><option value="contrast">contrast</option><option value="spectral">spectral</option></select></label><label><input type="checkbox" id="nerves">signals</label><label><input type="checkbox" id="learn">learn</label><span id="diagnostic"></span></div><div><button id="rare">rare event</button><button id="reset">reset learning</button><button id="pause">pause</button><button id="new">new field</button><button id="full">fullscreen</button></div></div><script type="module" src="./src/main.js"></script></body></html>
