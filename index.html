<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101017"><title>Where / living field</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111017;color:#fff;font:12px/1.4 Arial,Helvetica,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:pan-y}#ui{position:fixed;left:18px;right:18px;bottom:max(16px,env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-between;pointer-events:none;mix-blend-mode:difference}#ui span{letter-spacing:.11em;text-transform:uppercase}#buttons{display:flex;gap:12px;pointer-events:auto}button{background:none;color:inherit;border:0;padding:9px;cursor:pointer;font:inherit;letter-spacing:.07em}button:hover{opacity:.65}#error{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center}#error[hidden]{display:none}body.clean #ui{display:none}
</style></head><body><canvas id="field" aria-label="Continuously evolving material field"></canvas><div id="error" hidden></div><div id="ui"><span>where — field 003</span><div id="buttons"><button id="pause">pause</button><button id="seed">new field</button><button id="full">fullscreen</button></div></div>
<script type="module">
const canvas=document.querySelector('canvas'), error=document.querySelector('#error');
const gl=canvas.getContext('webgl2',{alpha:false,antialias:false,depth:false,stencil:false,preserveDrawingBuffer:false,powerPreference:'high-performance'});
if(!gl){error.hidden=false;error.textContent='This artwork needs WebGL 2. Try a recent Chrome, Firefox or Safari browser.';throw Error('WebGL 2 unavailable');}
const vert=`#version 300 es
void main(){vec2 p=vec2((gl_VertexID<<1)&2,gl_VertexID&2);gl_Position=vec4(p*2.-1.,0.,1.);}`;
const common=`precision highp float;
uniform sampler2D state;uniform vec2 size,screenSize;uniform float time,seed,dt,init;uniform vec4 a[10],b[10];out vec4 frag;
float hash(vec2 p){p=fract(p*vec2(.1031,.11369));p+=dot(p,p.yx+19.19+seed*.001);return fract((p.x+p.y)*p.x);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+1.),f.x),f.y);}
float fb(vec2 p){return .58*n(p)+.27*n(p*2.03+13.)+.15*n(p*4.11+27.);}
vec2 aspect(){return screenSize/min(screenSize.x,screenSize.y);}
vec2 world(vec2 uv){return (uv-.5)*aspect();}
float max4(vec4 v){return max(max(v.x,v.y),max(v.z,v.w));}
vec2 velocity(vec2 p){float t=time*.065;return vec2(.043*cos(p.y*5.8+t)+.025*cos(p.y*11.5-p.x*3.3-t*.7)+.013*sin(p.y*19.+p.x*7.+t),.046*sin(p.x*6.3-t)+.007173913*cos(p.y*11.5-p.x*3.3-t*.7)-.004789474*sin(p.y*19.+p.x*7.+t));}
`;
const sim=`#version 300 es
${common}
void main(){
 vec2 uv=gl_FragCoord.xy/size,p=world(uv),px=1./size;
 vec2 back=uv-velocity(p)*dt/aspect();vec4 c=texture(state,back);
 vec4 near=(texture(state,back+vec2(px.x,0))+texture(state,back-vec2(px.x,0))+texture(state,back+vec2(0,px.y))+texture(state,back-vec2(0,px.y)))*.25;
 vec4 dye=mix(c,near,clamp(dt*8.4,0.,.42));float e=fb(p*3.+vec2(time*.015,seed*.003));
 dye+=dt*(dye*(1.-dye)*(dye-.44)*2.4-.017*(.6+e));dye=max(dye,0.);
 vec4 inputDye=vec4(0);
 for(int i=0;i<10;i++){
  vec4 s=a[i];vec2 q=(p-s.xy)/max(s.z,.01);
  float radius=length(q*vec2(.8+float(i%3)*.2,1.15));
  float organic=fb(q*2.4+vec2(float(i)*19.,time*.037));
  float mask=1.-smoothstep(.66,.94,radius+(organic-.5)*.85);
  int k=i%4;inputDye[k]=max(inputDye[k],mask*b[i].w*.96);
 }
 dye=mix(dye,max(dye,inputDye),1.-exp(-dt*1.4));
 float over=max4(dye);dye-=dt*.8*dye*max(over-dye,0.);
 if(init>.5){
  vec2 q=p+vec2(fb(p*3.+3.)-.5,fb(p*3.+19.)-.5)*.26;
  float f=fb(q*2.8+seed*.01)+.13*fb(q*6.1+27.);
  float cut=smoothstep(.40,.49,f),h=fb(q*3.5+8.);
  vec4 phase=vec4(1.-smoothstep(.35,.49,h),smoothstep(.34,.46,h)*(1.-smoothstep(.49,.61,h)),smoothstep(.50,.62,h)*(1.-smoothstep(.66,.75,h)),smoothstep(.65,.76,h));
  dye=max(phase*cut*.88,inputDye*.85);
 }
 frag=clamp(dye,0.,1.);
}`;
const draw=`#version 300 es
${common}
float band(float x,float w){return 1.-smoothstep(w,w+max(fwidth(x),.0002),abs(x));}
vec3 acid=vec3(.80,.81,.035),yellow=vec3(1.,.88,.12),pink=vec3(1.,.31,.70),peach=vec3(1.,.65,.43),lilac=vec3(.77,.67,1.),paper=vec3(.96,.93,.91);
void main(){
 vec2 uv=gl_FragCoord.xy/size,p=world(uv);vec4 c=texture(state,uv);float mass=max4(c);
 float second=max(min(c.x,c.y),max(min(c.z,c.w),min(max(c.x,c.y),max(c.z,c.w))));
 float tt=time*.035;vec2 q=p+.09*vec2(fb(p*5.+tt)-.5,fb(p*5.+17.-tt)-.5);
 float macro=fb(q*5.+vec2(7.,tt)),fine=fb(q*28.);
 float m=mass+(macro-.5)*.055,d=m-.25,aa=max(fwidth(d),.001);
 vec2 g=abs(fract(p*9.+.5)-.5);float grid=max(band(g.x,.0016),band(g.y,.0016));
 float crosses=max(band(g.x,.008)*(1.-smoothstep(.026,.04,g.y)),band(g.y,.008)*(1.-smoothstep(.026,.04,g.x)));
 vec3 bg=vec3(.022,.017,.035)+grid*vec3(.14,.13,.16)+crosses*vec3(.26,.28,.14);
 float iso=band(fract((m+.10*macro)*24.+.5)-.5,.023);
 bg+=iso*vec3(.22,.30,.055)*smoothstep(.035,.22,m)*(1.-smoothstep(.23,.30,m));
 vec3 col=acid;
 if(c.y>=c.x&&c.y>=c.z&&c.y>=c.w)col=pink;else if(c.z>=c.x&&c.z>=c.y&&c.z>=c.w)col=peach;else if(c.w>=c.x&&c.w>=c.y&&c.w>=c.z)col=lilac;
 col=mix(col,mix(yellow,paper,smoothstep(.52,.76,macro)),smoothstep(.48,.69,macro)*.62);
 col=mix(col,paper,(1.-smoothstep(0.,.015,mass-second))*.42);
 float fold=sin(27.*m+macro*7.);col*=.93+.07*fold+.035*fine;
 col=mix(col,paper,band(m-.32,.0025)*.8);col=mix(col,pink,band(m-.275,.007)*.92);col=mix(col,paper,band(d,.005)*.95);
 vec3 result=mix(bg,col,smoothstep(-aa,aa,d));
 float internal=band(mass-second-.04,.003)*smoothstep(.34,.47,m)*smoothstep(.46,.7,macro);
 result=mix(result,vec3(.37,.43,.20),internal*.28);
 frag=vec4(clamp(result+(hash(gl_FragCoord.xy)-.5)*.012,0.,1.),1.);
}`;
function shader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}
function program(src){const p=gl.createProgram();const v=shader(gl.VERTEX_SHADER,vert),f=shader(gl.FRAGMENT_SHADER,src);gl.attachShader(p,v);gl.attachShader(p,f);gl.linkProgram(p);gl.deleteShader(v);gl.deleteShader(f);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));return {p,u:Object.fromEntries(['size','screenSize','time','seed','a[0]','b[0]','state','dt','init'].map(n=>[n,gl.getUniformLocation(p,n)]))}}
let simulation,render;try{simulation=program(sim);render=program(draw)}catch(e){error.hidden=false;error.textContent='Unable to start the artwork: '+e.message;throw e}
gl.bindVertexArray(gl.createVertexArray());gl.disable(gl.DEPTH_TEST);gl.disable(gl.BLEND);
const useFloat=!!gl.getExtension('EXT_color_buffer_float');
let stepDt=1/60,initialise=1;let targets=[],front=0,sw=0,sh=0,scale=.88,seed=Math.random()*1000,agents=[],clock=0,last=0,paused=false,raf=0,elapsed=0,frames=0;
const A=new Float32Array(40),B=new Float32Array(40);
function createTarget(w,h){const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);gl.texImage2D(gl.TEXTURE_2D,0,useFloat?gl.RGBA16F:gl.RGBA8,w,h,0,gl.RGBA,useFloat?gl.HALF_FLOAT:gl.UNSIGNED_BYTE,null);const f=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,f);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);if(gl.checkFramebufferStatus(gl.FRAMEBUFFER)!==gl.FRAMEBUFFER_COMPLETE)throw Error('Framebuffer unavailable');gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);return {t,f}}
function resize(){const w=canvas.clientWidth,h=canvas.clientHeight,dpr=Math.min(devicePixelRatio||1,1.65);canvas.width=Math.max(2,Math.round(w*dpr*scale));canvas.height=Math.max(2,Math.round(h*dpr*scale));const ratio=Math.min(1,640/Math.min(w,h),1024/Math.max(w,h));const nw=Math.max(2,Math.round(w*ratio)),nh=Math.max(2,Math.round(h*ratio));if(nw!==sw||nh!==sh||!targets.length){for(const x of targets){gl.deleteTexture(x.t);gl.deleteFramebuffer(x.f)}sw=nw;sh=nh;targets=[createTarget(sw,sh),createTarget(sw,sh)];front=0;initialise=1}gl.bindFramebuffer(gl.FRAMEBUFFER,null)}
const rnd=(a,b)=>a+(b-a)*Math.random();
function spawn(i,initial=false){const aspect=canvas.clientWidth/Math.max(1,canvas.clientHeight),w=Math.max(1,aspect),h=Math.max(1,1/aspect);return {x:rnd(-w*.48,w*.48),y:rnd(-h*.48,h*.48),r:rnd(.15,.36),rot:rnd(0,6.28),n:rnd(1,5),phase:rnd(0,6.28),hue:rnd(0,1),life:initial?rnd(5,18):0,ttl:rnd(20,55),vx:rnd(-.023,.023),vy:rnd(-.023,.023),id:i}}
function reset(){seed=Math.random()*1000;agents=Array.from({length:10},(_,i)=>spawn(i,true));clock=0;initialise=1;for(const x of targets){gl.bindFramebuffer(gl.FRAMEBUFFER,x.f);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT)}gl.bindFramebuffer(gl.FRAMEBUFFER,null);front=0}
function update(dt){for(let i=0;i<agents.length;i++){let x=agents[i];x.life+=dt;if(x.life>=x.ttl){x=agents[i]=spawn(i)}const age=x.life,fade=Math.min(1,age/6,(x.ttl-age)/8),growth=Math.max(.015,Math.sin(Math.min(1,age/10)*Math.PI/2)*Math.min(1,(x.ttl-age)/8));let cx=x.x+Math.sin(clock*.11+x.phase)*.055+x.vx*age*.28,cy=x.y+Math.cos(clock*.13+x.phase)*.06+x.vy*age*.28;for(let j=0;j<i;j++){const dx=cx-A[j*4],dy=cy-A[j*4+1],d=Math.hypot(dx,dy),min=(x.r+A[j*4+2])*.24;if(d>1e-4&&d<min){const push=(min-d)*.16;cx+=dx/d*push;cy+=dy/d*push}}
A.set([cx,cy,x.r*growth*(1+.09*Math.sin(clock*.25+x.phase)),x.rot+clock*.035*Math.sin(x.phase)],i*4);B.set([x.n,x.phase+clock*.14,x.hue,Math.max(0,fade)],i*4)}}
function pass(o,w,h,tex){gl.useProgram(o.p);const u=o.u;gl.viewport(0,0,w,h);gl.uniform2f(u.size,w,h);gl.uniform2f(u.screenSize,canvas.clientWidth,canvas.clientHeight);gl.uniform1f(u.time,clock);gl.uniform1f(u.seed,seed);gl.uniform1f(u.dt,stepDt);gl.uniform1f(u.init,initialise);gl.uniform4fv(u['a[0]'],A);gl.uniform4fv(u['b[0]'],B);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex);gl.uniform1i(u.state,0);gl.drawArrays(gl.TRIANGLES,0,3)}
function tick(now){raf=0;if(paused||document.hidden)return;const lastFrameWall=last?(now-last)/1000:1/60;const dt=Math.min(.05,lastFrameWall);last=now;clock+=dt;stepDt=dt;update(dt);gl.bindFramebuffer(gl.FRAMEBUFFER,targets[1-front].f);pass(simulation,sw,sh,targets[front].t);front=1-front;initialise=0;gl.bindFramebuffer(gl.FRAMEBUFFER,null);pass(render,canvas.width,canvas.height,targets[front].t);
elapsed+=lastFrameWall;frames++;if(elapsed>3){const fps=frames/elapsed;if(fps<28&&scale>.5){scale=Math.max(.5,scale-.12);resize()}elapsed=0;frames=0}raf=requestAnimationFrame(tick)}
function start(){if(!raf&&!paused&&!document.hidden){last=0;raf=requestAnimationFrame(tick)}}
function stop(){if(raf)cancelAnimationFrame(raf);raf=0;last=0}
resize();reset();update(0);start();
window.addEventListener('resize',()=>{resize();if(paused){gl.bindFramebuffer(gl.FRAMEBUFFER,null);pass(render,canvas.width,canvas.height,targets[front].t)}});
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());
document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'resume':'pause';paused?stop():start()};
document.querySelector('#seed').onclick=()=>{reset();update(0);if(paused){gl.bindFramebuffer(gl.FRAMEBUFFER,targets[1-front].f);pass(simulation,sw,sh,targets[front].t);front=1-front;initialise=0;gl.bindFramebuffer(gl.FRAMEBUFFER,null);pass(render,canvas.width,canvas.height,targets[front].t)}};
document.querySelector('#full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{document.body.classList.toggle('clean')}};
document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='h')document.body.classList.toggle('clean');if(e.code==='Space'&&e.target.tagName!=='BUTTON'){e.preventDefault();document.querySelector('#pause').click()}});
if(new URLSearchParams(location.search).has('clean'))document.body.classList.add('clean');
canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();stop();error.hidden=false;error.textContent='Graphics context lost. Reload to restart.'});canvas.addEventListener('webglcontextrestored',()=>location.reload());
</script></body></html>
