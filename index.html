<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101017"><title>Where / living field</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111017;color:#fff;font:12px/1.4 Arial,Helvetica,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:pan-y}#ui{position:fixed;left:18px;right:18px;bottom:max(16px,env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-between;pointer-events:none;mix-blend-mode:difference}#ui span{letter-spacing:.11em;text-transform:uppercase}#buttons{display:flex;gap:12px;pointer-events:auto}button{background:none;color:inherit;border:0;padding:9px;cursor:pointer;font:inherit;letter-spacing:.07em}button:hover{opacity:.65}#error{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center}#error[hidden]{display:none}body.clean #ui{display:none}
</style></head><body><canvas id="field" aria-label="Continuously evolving material field"></canvas><div id="error" hidden></div><div id="ui"><span>where — field 002</span><div id="buttons"><button id="pause">pause</button><button id="seed">new field</button><button id="full">fullscreen</button></div></div>
<script type="module">
const canvas=document.querySelector('canvas'), error=document.querySelector('#error');
const gl=canvas.getContext('webgl2',{alpha:false,antialias:false,depth:false,stencil:false,preserveDrawingBuffer:false,powerPreference:'high-performance'});
if(!gl){error.hidden=false;error.textContent='This artwork needs WebGL 2. Try a recent Chrome, Firefox or Safari browser.';throw Error('WebGL 2 unavailable');}
const vert=`#version 300 es
void main(){vec2 p=vec2((gl_VertexID<<1)&2,gl_VertexID&2);gl_Position=vec4(p*2.-1.,0.,1.);}`;
const common=`precision highp float;
uniform vec2 size,screenSize;
uniform float time,seed;
uniform vec4 a[10],b[10];
uniform sampler2D state;
out vec4 frag;
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7))+seed*.71)*43758.5453);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+1.),f.x),f.y);}
float fb(vec2 p){return .53*noise(p)+.27*noise(p*2.07+17.)+.13*noise(p*4.21+31.)+.07*noise(p*8.45+9.);}
vec2 world(vec2 uv){return (uv-.5)*screenSize/min(screenSize.x,screenSize.y);}
vec2 flow(vec2 p){float t=time*.09;return vec2(sin(p.y*6.+t+3.*noise(p*2.)),cos(p.x*5.-t+3.*noise(p*2.+9.)))+.6*vec2(cos(p.y*13.-t),sin(p.x*11.+t));}
float smoothmax(float x,float y,float k){float h=max(k-abs(x-y),0.)/k;return max(x,y)+h*h*k*.25;}
vec4 matter(vec2 p){
 float t=time*.07;
 vec2 q=p+.18*vec2(fb(p*3.+vec2(t,-t))-0.5,fb(p*3.+vec2(9.-t,12.+t))-.5);
 float d=-2.,pig=0.,weight=0.,detail=0.;
 for(int i=0;i<10;i++){
  vec4 f=a[i],g=b[i];vec2 z=q-f.xy;float angle=f.w;float cs=cos(angle),sn=sin(angle);z=mat2(cs,-sn,sn,cs)*z;
  z*=vec2(.63+.45*sin(g.y*.31+float(i)),1.12+.33*cos(g.y*.27));
  float radius=max(.002,f.z);vec2 local=z/radius;
  float n=fb(local*1.7+vec2(g.y*.25,float(i)*7.));
  float m=fb(local*3.6+vec2(-g.y*.19,9.));
  float sdf=radius*(.78+.64*(n-.5)+.29*(m-.5)-length(local));
  sdf-=.13*(1.-g.w);
  d=smoothmax(d,sdf,.095);
  float w=exp(-dot(local,local)*1.8)*g.w;
  weight+=w;pig+=w*g.z;detail+=w*n;
 }
 return vec4(d,pig/max(weight,.0001),detail/max(weight,.0001),weight);
}`;
const sim=`#version 300 es
${common}
void main(){
 vec2 uv=gl_FragCoord.xy/size,p=world(uv),px=1./size;
 vec2 adv=uv-flow(p)*px*1.2;
 vec4 c=texture(state,adv);
 vec4 avg=(texture(state,adv+vec2(px.x,0))+texture(state,adv-vec2(px.x,0))+texture(state,adv+vec2(0,px.y))+texture(state,adv-vec2(0,px.y)))*.25;
 vec4 m=matter(p);
 float target=smoothstep(-.085,.055,m.x);
 float f=fb(p*4.+vec2(time*.025,-time*.013));
 float mass=mix(c.r,avg.r,.18);
 mass=mix(mass,target,.045);
 float v=mix(c.g,avg.g,.24);
 v=mix(v,smoothstep(.22,.75,mass)*(.24+.76*f),.055);
 float pigment=mix(c.b,clamp(m.y+.21*(f-.5),0.,1.),.045*target+.012);
 float trail=mix(c.a,avg.a,.18);
 trail=mix(trail,smoothstep(.12,.6,mass)*(1.-smoothstep(.58,.95,mass)),.065);
 frag=vec4(mass,v,pigment,trail);
}`;
const draw=`#version 300 es
${common}
vec3 acid=vec3(.82,.85,.035),yellow=vec3(1.,.91,.18),pink=vec3(1.,.22,.65),red=vec3(.98,.17,.14),peach=vec3(1.,.65,.40),cream=vec3(1.,.96,.83),lilac=vec3(.72,.67,1.);
vec3 pigment(float x){x=fract(x);vec3 c=mix(acid,yellow,smoothstep(.0,.22,x));c=mix(c,peach,smoothstep(.27,.38,x));c=mix(c,pink,smoothstep(.40,.52,x));c=mix(c,lilac,smoothstep(.57,.67,x));c=mix(c,cream,smoothstep(.72,.82,x));return mix(c,red,smoothstep(.89,.98,x));}
float line(float x,float width){return 1.-smoothstep(width,width+max(fwidth(x),.0001),abs(x));}
float contour(float x,float stepSize){return line((fract(x/stepSize+.5)-.5)*stepSize,.00055);}
void main(){
 vec2 uv=gl_FragCoord.xy/size,p=world(uv);
 vec4 c=texture(state,uv),m=matter(p);
 float t=time*.065;
 vec2 warp=vec2(fb(p*4.+vec2(t,0)),fb(p*4.+vec2(19.,-t)));
 vec2 q=p+.13*(warp-.5);
 float n=fb(q*5.5+vec2(t*.4,-t*.3)),fine=fb(q*24.+vec2(0.,t*.3));
 float d=m.x+(c.r-.5)*.093+(n-.5)*.105;
 float aa=max(fwidth(d),.0012);
 vec2 grid=abs(fract(p*10.+.5)-.5);
 float glines=max(line(grid.x,.003),line(grid.y,.003));
 vec2 g=abs(fract(p*10.+.5)-.5);
 float cross=max(line(g.x,.008)*(1.-smoothstep(.035,.065,g.y)),line(g.y,.008)*(1.-smoothstep(.035,.065,g.x)));
 vec3 bg=vec3(.015,.014,.022)+glines*vec3(.105,.09,.12)+cross*vec3(.24,.26,.15);
 float loops=contour(d,.015)*smoothstep(-.29,-.04,d)*(1.-smoothstep(-.04,.005,d));
 float ripple=contour(d+.023*sin(n*11.+time*.17),.029)*smoothstep(-.21,-.035,d);
 bg+=loops*mix(vec3(.15,.19,.025),vec3(.42,.12,.24),smoothstep(.25,.8,n))*.7+ripple*vec3(.11,.16,.07);
 float family=fract(.66*m.y+.29*c.b+.13*n+.11*sin(t*.27));
 vec3 body=pigment(family);
 float folded=fb(q*8.+vec2(5.+t*.27,12.));
 float strata=sin((folded+.29*d)*28.+n*3.);
 float pocket=fb(q*10.+vec2(-t*.24,8.));
 body=mix(body,acid,smoothstep(.49,.72,n)*.75);
 body=mix(body,pink,smoothstep(.49,.7,pocket)*.7);
 body=mix(body,cream,smoothstep(.68,.83,pocket)*.83);
 body=mix(body,lilac,smoothstep(.70,.86,folded)*.8);
 body*=.86+.12*strata+.13*fine;
 // Branching internal ridges: distorted cellular boundaries at multiple scales.
 vec2 vp=q*12.+(warp-.5)*2.7;vec2 cell=floor(vp),f=fract(vp);float first=10.,second=10.;
 for(int yy=-1;yy<=1;yy++){for(int xx=-1;xx<=1;xx++){vec2 ij=vec2(float(xx),float(yy));vec2 off=vec2(hash(cell+ij+12.),hash(cell+ij+37.));vec2 z=ij+off-f;float dd=dot(z,z);if(dd<first){second=first;first=dd;}else second=min(second,dd);}}
 float veins=(1.-smoothstep(.005,.045,second-first))*smoothstep(.28,.62,n)*smoothstep(.015,.075,d);
 body=mix(body,vec3(.34,.42,.21),veins*.29);
 float skin=exp(-abs(d-.006)*140.),rim=exp(-abs(d+.006)*95.);
 body=mix(body,pink,rim*.83);body=mix(body,cream,skin*.95);
 float cut=n+.24*fine;
 float aperture=smoothstep(.72,.79,cut)*smoothstep(.03,.09,d)*smoothstep(.48,.8,1.-m.y);
 vec3 col=mix(bg,body,smoothstep(-aa,aa,d)*(1.-aperture*.94));
 // Small disconnected chemical islands, not decorative sprites.
 float island=fb(q*39.+vec2(t*.5,0.))+.21*fb(q*9.);
 float speck=smoothstep(.83,.88,island)*smoothstep(-.2,-.04,d)*(1.-smoothstep(-.04,-.005,d));
 col=mix(col,mix(yellow,cream,n),speck*.86);
 col+=vec3((hash(gl_FragCoord.xy)-.5)*.021);
 frag=vec4(clamp(col,0.,1.),1.);
}`;
function shader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}
function program(src){const p=gl.createProgram();const v=shader(gl.VERTEX_SHADER,vert),f=shader(gl.FRAGMENT_SHADER,src);gl.attachShader(p,v);gl.attachShader(p,f);gl.linkProgram(p);gl.deleteShader(v);gl.deleteShader(f);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));return {p,u:Object.fromEntries(['size','screenSize','time','seed','a[0]','b[0]','state'].map(n=>[n,gl.getUniformLocation(p,n)]))}}
let simulation,render;try{simulation=program(sim);render=program(draw)}catch(e){error.hidden=false;error.textContent='Unable to start the artwork: '+e.message;throw e}
gl.bindVertexArray(gl.createVertexArray());gl.disable(gl.DEPTH_TEST);gl.disable(gl.BLEND);
let targets=[],front=0,sw=0,sh=0,scale=.88,seed=Math.random()*1000,agents=[],clock=0,last=0,paused=false,raf=0,elapsed=0,frames=0;
const A=new Float32Array(40),B=new Float32Array(40);
function createTarget(w,h){const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);const f=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,f);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);if(gl.checkFramebufferStatus(gl.FRAMEBUFFER)!==gl.FRAMEBUFFER_COMPLETE)throw Error('Framebuffer unavailable');gl.clearColor(.18,.1,.35,0);gl.clear(gl.COLOR_BUFFER_BIT);return {t,f}}
function resize(){const w=canvas.clientWidth,h=canvas.clientHeight,dpr=Math.min(devicePixelRatio||1,1.65);canvas.width=Math.max(2,Math.round(w*dpr*scale));canvas.height=Math.max(2,Math.round(h*dpr*scale));const ratio=Math.min(1,640/Math.min(w,h),1024/Math.max(w,h));const nw=Math.max(2,Math.round(w*ratio)),nh=Math.max(2,Math.round(h*ratio));if(nw!==sw||nh!==sh||!targets.length){for(const x of targets){gl.deleteTexture(x.t);gl.deleteFramebuffer(x.f)}sw=nw;sh=nh;targets=[createTarget(sw,sh),createTarget(sw,sh)];front=0}gl.bindFramebuffer(gl.FRAMEBUFFER,null)}
const rnd=(a,b)=>a+(b-a)*Math.random();
function spawn(i,initial=false){const aspect=canvas.clientWidth/Math.max(1,canvas.clientHeight),w=Math.max(1,aspect),h=Math.max(1,1/aspect);return {x:rnd(-w*.48,w*.48),y:rnd(-h*.48,h*.48),r:rnd(.16,.51),rot:rnd(0,6.28),n:rnd(1,5),phase:rnd(0,6.28),hue:rnd(0,1),life:initial?rnd(5,18):0,ttl:rnd(35,95),vx:rnd(-.023,.023),vy:rnd(-.023,.023),id:i}}
function reset(){seed=Math.random()*1000;agents=Array.from({length:10},(_,i)=>spawn(i,true));clock=0;for(const x of targets){gl.bindFramebuffer(gl.FRAMEBUFFER,x.f);gl.clearColor(.18,.1,.35,0);gl.clear(gl.COLOR_BUFFER_BIT)}gl.bindFramebuffer(gl.FRAMEBUFFER,null);front=0}
function update(dt){for(let i=0;i<agents.length;i++){let x=agents[i];x.life+=dt;if(x.life>=x.ttl){x=agents[i]=spawn(i)}const age=x.life,fade=Math.min(1,age/9,(x.ttl-age)/12),growth=Math.max(.015,Math.sin(Math.min(1,age/16)*Math.PI/2)*Math.min(1,(x.ttl-age)/12));let cx=x.x+Math.sin(clock*.11+x.phase)*.055+x.vx*age*.28,cy=x.y+Math.cos(clock*.13+x.phase)*.06+x.vy*age*.28;for(let j=0;j<i;j++){const dx=cx-A[j*4],dy=cy-A[j*4+1],d=Math.hypot(dx,dy),min=(x.r+A[j*4+2])*.24;if(d>1e-4&&d<min){const push=(min-d)*.16;cx+=dx/d*push;cy+=dy/d*push}}
A.set([cx,cy,x.r*growth*(1+.09*Math.sin(clock*.25+x.phase)),x.rot+clock*.035*Math.sin(x.phase)],i*4);B.set([x.n,x.phase+clock*.14,x.hue,Math.max(0,fade)],i*4)}}
function pass(o,w,h,tex){gl.useProgram(o.p);const u=o.u;gl.viewport(0,0,w,h);gl.uniform2f(u.size,w,h);gl.uniform2f(u.screenSize,canvas.clientWidth,canvas.clientHeight);gl.uniform1f(u.time,clock);gl.uniform1f(u.seed,seed);gl.uniform4fv(u['a[0]'],A);gl.uniform4fv(u['b[0]'],B);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex);gl.uniform1i(u.state,0);gl.drawArrays(gl.TRIANGLES,0,3)}
function tick(now){raf=0;if(paused||document.hidden)return;const lastFrameWall=last?(now-last)/1000:1/60;const dt=Math.min(.05,lastFrameWall);last=now;clock+=dt;update(dt);gl.bindFramebuffer(gl.FRAMEBUFFER,targets[1-front].f);pass(simulation,sw,sh,targets[front].t);front=1-front;gl.bindFramebuffer(gl.FRAMEBUFFER,null);pass(render,canvas.width,canvas.height,targets[front].t);
elapsed+=lastFrameWall;frames++;if(elapsed>3){const fps=frames/elapsed;if(fps<28&&scale>.5){scale=Math.max(.5,scale-.12);resize()}elapsed=0;frames=0}raf=requestAnimationFrame(tick)}
function start(){if(!raf&&!paused&&!document.hidden){last=0;raf=requestAnimationFrame(tick)}}
function stop(){if(raf)cancelAnimationFrame(raf);raf=0;last=0}
resize();reset();update(0);start();
window.addEventListener('resize',()=>{resize();if(paused){gl.bindFramebuffer(gl.FRAMEBUFFER,null);pass(render,canvas.width,canvas.height,targets[front].t)}});
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());
document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'resume':'pause';paused?stop():start()};
document.querySelector('#seed').onclick=()=>{reset();update(0);if(paused){gl.bindFramebuffer(gl.FRAMEBUFFER,null);pass(render,canvas.width,canvas.height,targets[front].t)}};
document.querySelector('#full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{document.body.classList.toggle('clean')}};
document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='h')document.body.classList.toggle('clean');if(e.code==='Space'&&e.target.tagName!=='BUTTON'){e.preventDefault();document.querySelector('#pause').click()}});
if(new URLSearchParams(location.search).has('clean'))document.body.classList.add('clean');
canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();stop();error.hidden=false;error.textContent='Graphics context lost. Reload to restart.'});canvas.addEventListener('webglcontextrestored',()=>location.reload());
</script></body></html>
