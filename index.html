 void main(){ivec2 screen=ivec2(gl_FragCoord.xy),p=ivec2(screen.x,dims.y-1-screen.y);float best=0.,brightest=0.;int idx=0,ci=0;for(int k=0;k<5;k++){float v=f(p,k*3);if(v>best){best=v;idx=k;}float b=f(p,k*3+1);if(b>brightest){brightest=b;ci=k;}}
 float r=f(p,15),h=f(p,16),cut=smoothstep(.46,.69,h)*(.85+.35*sin(time*.06+float(idx)));float d=best-.40+(r-.5)*.75-cut*2.2-f(p,idx*3+2)*.95;

 float edge=1.-smoothstep(.012,.045,abs(d)),trace=smoothstep(.008,.13,prev)*(1.-live);float lines=(1.-smoothstep(.009,.038,abs(d+.10)))*.72+(1.-smoothstep(.009,.032,abs(d+.20)))*.44;
 float a=clamp(max(max(live,edge*.95),max(trace*.10,lines*.46)),0.,1.);int off=idx*5,co=ci*5;vec3 col=mix(palette[off],palette[off+1],smoothstep(.23,.79,r)*.72);col=mix(col,palette[off+2],smoothstep(.33,.75,h)*.76);col*=.98+.025*sin(d*22.+h*12.);col=mix(col,vec3(244,228,212)/255.,edge*.8);

 function shader(t,s){let x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(x));return x}let pr=gl.createProgram();gl.attachShader(pr,shader(gl.VERTEX_SHADER,vertex));gl.attachShader(pr,shader(gl.FRAGMENT_SHADER,fragment));gl.linkProgram(pr);if(!gl.getProgramParameter(pr,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(pr));gl.useProgram(pr);gl.bindVertexArray(gl.createVertexArray());const u=Object.fromEntries(['data','previous','veins','dims','palette[0]','time'].map(x=>[x,gl.getUniformLocation(pr,x)]));gl.uniform1i(u.data,0);gl.uniform1i(u.previous,1);gl.uniform1i(u.veins,2);

function startGPU(){try{gpu?.dispose();gpu=makeGPU()}catch(e){console.warn('GPU compositor unavailable',e);gpu=null}}

function init(){seed=R(0,999);time=0;frame=0;groups=[];rough=new Float32Array(W*H);holes=new Float32Array(W*H);for(let y=0,i=0;y<H;y++)for(let x=0;x<W;x++,i++){let u=x/S,v=y/S;rough[i]=fb(u*9,v*9);let q=fb(u*4.4+11,v*4.4+8);holes[i]=.78*fb(u*5.5+q*2.6,v*5.5-q*2.6)+.22*fb(u*18+8,v*18)}old=new Float32Array(W*H);for(let k=0;k<5;k++)spawn(k,true);startGPU()}
function spawn(k,initial=false){let wide=W>H;let gx=wide?(k+.35+R(-.25,.25))/5*W:R(.05,.95)*W,gy=wide?R(.12,.88)*H:(k+.35+R(-.28,.28))/5*H;let g={x:gx,y:gy,age:initial?R(12,28):0,life:R(65,110),palette:Math.floor(R(0,palettes.length)),r:S*R(.17,.30),rot:R(0,6.28),phase:R(0,9),nodes:[],tips:[],cells:[],scar:[]};let count=Math.floor(R(22,38));g.nodes.push({x:0,y:0,r:g.r*.49,parent:-1,depth:0,p:R(0,6)});for(let j=1;j<count;j++){let par=j<7?0:Math.floor(R(Math.max(0,j-12),j)),p=g.nodes[par],a=R(0,6.28),len=g.r*R(.14,.55)*(par===0?1.3:1),x=p.x+Math.cos(a)*len,y=p.y+Math.sin(a)*len;let d=Math.hypot(x,y),lim=g.r*R(1.05,1.7);if(d>lim){x*=lim/d;y*=lim/d}g.nodes.push({x,y,r:g.r*R(.13,.40),parent:par,depth:p.depth+1,p:R(0,6)});}for(let j=0;j<Math.floor(R(5,12));j++){let p=g.nodes[Math.floor(R(0,g.nodes.length))];g.cells.push({x:p.x+R(-.15,.15)*g.r,y:p.y+R(-.15,.15)*g.r,r:g.r*R(.10,.37),phase:R(0,6),birth:R(0,26),color:Math.random()<.72?3:4})}for(let j=0;j<12;j++){let p=g.nodes[Math.floor(R(0,g.nodes.length))];g.scar.push({x:p.x,y:p.y,r:g.r*R(.10,.36),phase:R(0,6)})}groups[k]=g}
function resize(){let d=Math.min(devicePixelRatio||1,1.5);view.width=Math.round(innerWidth*d);view.height=Math.round(innerHeight*d);let scale=Math.min(1,740/Math.max(innerWidth,innerHeight));W=Math.max(2,Math.round(innerWidth*scale));H=Math.max(2,Math.round(innerHeight*scale));S=Math.min(W,H);layer.width=vein.width=W;layer.height=vein.height=H;field=new Float32Array(W*H);tint=new Float32Array(W*H);cell=new Float32Array(W*H);mem=new Float32Array(W*H);img=lc.createImageData(W,H);init();render()}
function stamp(arr,x,y,r,weight,stretch=1){if(r<1)return;let rx=r*stretch,ry=r/Math.sqrt(stretch),l=Math.max(0,Math.floor(x-rx)),rr=Math.min(W-1,Math.ceil(x+rx)),t=Math.max(0,Math.floor(y-ry)),b=Math.min(H-1,Math.ceil(y+ry));for(let j=t;j<=b;j++){let dy=(j-y)/ry,dy2=dy*dy;for(let i=l;i<=rr;i++){let dx=(i-x)/rx,v=1-dx*dx-dy2;if(v>0)arr[j*W+i]+=weight*v*v}}}
function advance(dt){time+=dt;for(let k=0;k<groups.length;k++){let g=groups[k];g.age+=dt;if(g.age>g.life){spawn(k);continue}let drift=S*.0025;g.x+=Math.sin(time*.14+g.phase)*drift*dt;g.y+=Math.cos(time*.17+g.phase)*drift*dt;for(let j=1;j<g.nodes.length;j++){let n=g.nodes[j],p=g.nodes[n.parent];let wx=cl(Math.round(g.x+n.x),0,W-1),wy=cl(Math.round(g.y+n.y),0,H-1),i=wy*W+wx;let nutrient=1-holes[i],competition=0;for(let other of groups){if(other!==g){let dist=Math.hypot(g.x+n.x-other.x,g.y+n.y-other.y);competition+=Math.max(0,1-dist/(other.r*1.4));}}n.energy=cl((n.energy??.75)+dt*(nutrient-.38-.28*competition)*.12,.18,1);let dx=n.x-p.x,dy=n.y-p.y,l=Math.hypot(dx,dy)||1;let push=Math.sin(time*.21+n.p)*g.r*.028;n.x+=(-dy/l*push+(Math.cos(n.p+time*.13)*g.r*.004))*dt;n.y+=(dx/l*push+Math.sin(n.p+time*.15)*g.r*.004)*dt}if(Math.random()<dt*.4&&g.nodes.length<48){let j=Math.floor(R(0,g.nodes.length)),p=g.nodes[j],a=R(0,6.28);g.nodes.push({x:p.x+Math.cos(a)*g.r*.23,y:p.y+Math.sin(a)*g.r*.23,r:g.r*R(.1,.24),parent:j,depth:p.depth+1,p:R(0,6)})}if(Math.random()<dt*.32&&g.cells.length<20){let p=g.nodes[Math.floor(R(0,g.nodes.length))];g.cells.push({x:p.x,y:p.y,r:g.r*R(.10,.29),phase:R(0,6),birth:g.age,color:Math.random()<.65?3:4})}}}
function render(){field.fill(0);tint.fill(0);cell.fill(0);mem.fill(0);let pixels=img.data;pixels.fill(0);vc.clearRect(0,0,W,H);let groupFields=[];for(let k=0;k<groups.length;k++){let g=groups[k],f=new Float32Array(W*H),p=new Float32Array(W*H),h=new Float32Array(W*H),pal=palettes[g.palette],life=sm(0,14,g.age)*(1-sm(g.life-18,g.life,g.age)),breath=1+.1*Math.sin(time*.17+g.phase),scale=Math.max(.03,life)*breath;let rot=g.rot+.07*Math.sin(time*.11+g.phase),cs=Math.cos(rot),sn=Math.sin(rot);function pos(n){return [g.x+(n.x*cs-n.y*sn)*scale,g.y+(n.x*sn+n.y*cs)*scale]};for(let n of g.nodes){let [x,y]=pos(n),r=n.r*scale*(.65+.45*(n.energy??.75))*(1+.16*Math.sin(time*.22+n.p));stamp(f,x,y,r*1.45,1.0,1+.27*Math.sin(n.p));if(n.parent>=0){let pp=pos(g.nodes[n.parent]);vc.beginPath();vc.moveTo(...pp);vc.quadraticCurveTo(mix(pp[0],x,.5)+Math.sin(n.p)*r*.23,mix(pp[1],y,.5)+Math.cos(n.p)*r*.23,x,y);vc.strokeStyle='rgba(52,67,30,'+(life*.48)+')';vc.lineWidth=Math.max(.35,S*.0012*(1-n.depth*.08));vc.stroke();}}for(let s of g.scar){let [x,y]=pos(s);stamp(h,x,y,s.r*scale*1.4,1.7*(.65+.35*Math.sin(time*.18+s.phase)));}for(let c of g.cells){let [x,y]=pos(c),a=g.age-c.birth;if(a<0)continue;let s=sm(0,7,a)*(1-sm(27,40,a));if(s<=0)continue;let drift=g.r*.13;x+=Math.cos(time*.25+c.phase)*drift;y+=Math.sin(time*.19+c.phase)*drift;stamp(p,x,y,c.r*scale*s*1.22,1.2,c.color===4?.83:1.15)}groupFields.push({f,p,h,pal,life});}

for(let i=0;i<W*H;i++){let best=0,idx=0,cmax=0,ci=0,second=0;for(let k=0;k<groupFields.length;k++){let g=groupFields[k],v=g.f[i];if(v>best){second=best;best=v;idx=k}else second=Math.max(second,v);if(g.p[i]>cmax){cmax=g.p[i];ci=k}}let g=groupFields[idx],p=groupFields[ci],r=rough[i],h=holes[i];let cut=sm(.46,.69,h)*(.85+.35*Math.sin(time*.06+idx));let d=best-.40+(r-.5)*.75-cut*2.2-g.h[i]*.95;let live=sm(-.027,.045,d),prev=old[i];old[i]=Math.max(live,prev*.993);let edge=1-sm(.012,.045,Math.abs(d)),trace=sm(.008,.13,prev)*(1-live);let line=(1-sm(.009,.038,Math.abs(d+.10)))*.72+(1-sm(.009,.032,Math.abs(d+.20)))*.44;let alpha=cl(Math.max(live,edge*.95,trace*.10,line*.46));let pal=g.pal,u=sm(.23,.79,r),v=sm(.33,.75,h),bright=sm(.24,.31,cmax),rim=(1-sm(.012,.035,Math.abs(cmax-.31)))*bright,ccmix=sm(.62,.94,cmax)*.23,contour=.98+.025*Math.sin(d*22+h*12),o=i*4;for(let j=0;j<3;j++){let c=mix(pal[0][j],pal[1][j],u*.72);c=mix(c,pal[2][j],v*.76);c*=contour;c=mix(c,[244,228,212][j],edge*.8);if(d<0)c=mix([63,79,27][j],[201,33,94][j],r);if(live<.1&&edge>.4)c=mix(c,[239,90,151][j],edge*.75);let ccol=mix(p.pal[3][j],p.pal[4][j],ccmix);ccol=mix(ccol,[255,190,147][j],rim*.63);pixels[o+j]=mix(c,ccol,bright)}let ca=bright;alpha=Math.max(alpha,ca);pixels[o+3]=alpha*255;mem[i]=live*(1-ca)}lc.putImageData(img,0,0);

function compose(material,network){ctx.fillStyle='#08070a';ctx.fillRect(0,0,view.width,view.height);let step=view.height*.13;ctx.strokeStyle='rgba(162,150,158,.23)';ctx.lineWidth=.7;ctx.beginPath();for(let x=step*.5;x<view.width;x+=step){ctx.moveTo(x,0);ctx.lineTo(x,view.height)}for(let y=step*.5;y<view.height;y+=step){ctx.moveTo(0,y);ctx.lineTo(view.width,y)}ctx.stroke();ctx.strokeStyle='rgba(190,114,61,.55)';ctx.beginPath();for(let x=step*.5;x<view.width;x+=step)for(let y=step*.5;y<view.height;y+=step){ctx.moveTo(x-3,y);ctx.lineTo(x+3,y);ctx.moveTo(x,y-3);ctx.lineTo(x,y+3)}ctx.stroke();ctx.imageSmoothingEnabled=true;ctx.drawImage(material,0,0,view.width,view.height);if(network)ctx.drawImage(network,0,0,view.width,view.height)}
