function init(){seed=R(0,1000);t=0;front=0;groups=[];const ax=W/U,ay=H/U,nx=Math.ceil(ax*1.9),ny=Math.ceil(ay*1.65);for(let y=0;y<ny;y++)for(let x=0;x<nx;x++)if(Math.random()>.22)groups.push(makeGroup((x+.5+R(-.37,.37))/nx*ax,(y+.5+R(-.37,.37))/ny*ay,true));if(groups.length<3)groups.push(makeGroup(ax*.72,ay*.7,true));for(const target of targets){gl.bindFramebuffer(gl.FRAMEBUFFER,target.f);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT)}gl.bindFramebuffer(gl.FRAMEBUFFER,null)}

function raster(){sc.globalCompositeOperation='source-over';sc.fillStyle='#000';sc.fillRect(0,0,W,H);for(const g of groups){const fade=cl(g.age/12)*cl((g.ttl-g.age)/15),scale=g.r*(.72+.28*Math.sin(Math.min(1,g.age/22)*Math.PI/2))*fade;if(scale<.012)continue;ss.setTransform(1,0,0,1,0,0);ss.clearRect(0,0,W,H);ss.save();ss.translate((g.x+.035*Math.sin(t*.13+g.phase))*U,(g.y+.025*Math.cos(t*.12+g.phase))*U);ss.rotate(g.rot+.12*Math.sin(t*.085+g.phase));ss.scale(scale*U,scale*U*g.squash);ss.globalCompositeOperation='source-over';const edge=g.outline.map((p,i)=>{let w=1+.045*Math.sin(i*.73+t*.38+g.phase)+.025*Math.sin(i*1.57-t*.2);return [p[0]*w,p[1]*w]});poly(ss,edge);ss.clip();ss.fillStyle='rgb(255,0,'+Math.round(g.h*255)+')';ss.fillRect(-1.5,-1.5,3,3);for(let i=0;i<g.cells.length;i++){const p=g.cells[i],s=g.sites[i];if(p.length<3)continue;let h=cl(s.h+.13*Math.sin(t*.15+s.phase));let gr=ss.createLinearGradient(s.x-.3,s.y-.3,s.x+.32,s.y+.32);gr.addColorStop(0,'rgb(255,0,'+Math.round(cl(h-.16)*255)+')');gr.addColorStop(1,'rgb(255,0,'+Math.round(cl(h+.16)*255)+')');ss.fillStyle=gr;poly(ss,p);ss.fill();if(s.open>.025){let amount=s.open*s.inset*(.86+.17*Math.sin(t*.23+s.phase));let hole=[];for(let j=0;j<p.length;j++){let a=p[j],b=p[(j+1)%p.length];for(let k=0;k<4;k++){let v=k/4,x=mix(a[0],b[0],v),y=mix(a[1],b[1],v),w=amount*(1+s.jitter*Math.sin(j*3+k*1.8+s.phase+t*.17));hole.push([mix(s.x,x,w),mix(s.y,y,w)])}}ss.globalCompositeOperation='destination-out';poly(ss,hole);ss.fillStyle='#000';ss.fill();ss.globalCompositeOperation='source-over'}}ss.restore();sc.globalCompositeOperation='lighten';sc.drawImage(scratch,0,0);sc.globalCompositeOperation='source-over';sc.save();sc.translate((g.x+.035*Math.sin(t*.13+g.phase))*U,(g.y+.025*Math.cos(t*.12+g.phase))*U);sc.rotate(g.rot+.12*Math.sin(t*.085+g.phase));sc.scale(scale*U,scale*U*g.squash);sc.globalCompositeOperation='lighter';if(g.style!==2)for(const b of g.buds){let maturity=cl((g.age-(b.born||0)-b.j*1.3)/7)*cl((g.ttl-g.age)/10), const vertex='#version 300 es\nvoid main(){vec2 p=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2));gl_Position=vec4(p*2.-1.,0.,1.);}';
const common=`precision highp float;uniform sampler2D state,feed;uniform vec2 size,simSize,aspect;uniform float time,dt,seed,first;out vec4 frag;

const sim='#version 300 es\n'+common+`void main(){vec2 uv=gl_FragCoord.xy/size,px=1./simSize,p=uv*aspect;vec2 at=uv-flow(p)*dt/aspect;vec4 c=texture(state,at),a=texture(state,at+vec2(px.x,0)),b=texture(state,at-vec2(px.x,0)),d=texture(state,at+vec2(0,px.y)),e=texture(state,at-vec2(0,px.y));vec4 lo=min(min(a,b),min(d,e)),hi=max(max(a,b),max(d,e)),avg=(a+b+d+e)*.25;vec3 f=texture(feed,uv).rgb;float n=fb(p*11.+vec2(time*.04,-time*.027));float target=smoothstep(.14,.78,f.r);float v=mix(c.r,avg.r,.12);v=mix(v,hi.r,dt*(.7+1.4*n));v=mix(v,lo.r,dt*(.5+1.4*(1.-n)));v=mix(v,target,1.-exp(-dt*1.45));float cell=mix(c.g,avg.g,.19);cell=mix(cell,f.g,1.-exp(-dt*2.4));float dye=mix(c.b,avg.b,.33);dye=mix(dye,f.b,1.-exp(-dt*(.6+target*2.)));float mem=max(v,mix(c.a,avg.a,.14)*exp(-dt*.105));if(first>.5){v=target;cell=f.g;dye=f.b;mem=first>1.5?max(v,c.a*.62):v;}frag=clamp(vec4(v,cell,dye,mem),0.,1.);}`;
const draw='#version 300 es\n'+common+`float line(float x,float w){return 1.-smoothstep(w,w+max(fwidth(x),.0002),abs(x));}vec3 pal(float x){vec3 c=mix(vec3(.71,.72,.015),vec3(.99,.94,.18),smoothstep(.04,.27,x));c=mix(c,vec3(.80,.79,.65),smoothstep(.31,.45,x));c=mix(c,vec3(.99,.59,.36),smoothstep(.49,.61,x));c=mix(c,vec3(.99,.37,.66),smoothstep(.66,.78,x));return mix(c,vec3(.67,.60,.98),smoothstep(.86,.97,x));}void main(){vec2 uv=gl_FragCoord.xy/size,p=uv*aspect,px=1./simSize;vec4 c=texture(state,uv);float n=fb(p*15.+time*.035),f=noise(p*150.);vec2 warp=vec2(fb(p*13.+time*.026),fb(p*13.+vec2(27.,-time*.029)))-.5;uv+=warp*.038/aspect;c=texture(state,uv);float m=c.r+(n-.5)*.068;float d=m-.40;vec2 g=abs(fract(p*8.+.5)-.5);float cross=max(line(g.x,.003)*(1.-smoothstep(.037,.049,g.y)),line(g.y,.003)*(1.-smoothstep(.037,.049,g.x)));float grid=max(line(g.x,.001),line(g.y,.001));vec3 col=vec3(.006,.005,.009)+cross*vec3(.32,.23,.13)+grid*vec3(.10,.09,.11)*smoothstep(.07,.32,c.a);float ghost=c.a-c.r;float iso=line(fract((c.a+.028*n)*18.+.5)-.5,.018)*smoothstep(.045,.14,c.a)*(1.-smoothstep(.3,.48,c.r));float oldEdge=line(c.a-.33,.013)*(1.-smoothstep(.22,.39,c.r));col+=oldEdge*vec3(.37,.095,.12);col+=iso*mix(vec3(.20,.035,.09),vec3(.15,.22,.035),smoothstep(.4,.68,n))*(.45+.55*ghost);float pcol=clamp(c.b+.16*(n-.5),0.,1.);vec3 tissue=pal(pcol);float gx=texture(state,uv+vec2(px.x,0)).r-texture(state,uv-vec2(px.x,0)).r,gy=texture(state,uv+vec2(0,px.y)).r-texture(state,uv-vec2(0,px.y)).r;float shade=clamp(.94+.30*(gx-gy)+.07*(n-.5),.65,1.15);tissue*=shade;float edgeD=abs(texture(state,uv+vec2(px.x,0)).b-texture(state,uv-vec2(px.x,0)).b)+abs(texture(state,uv+vec2(0,px.y)).b-texture(state,uv-vec2(0,px.y)).b);tissue=mix(tissue,vec3(.48,.50,.17),smoothstep(.025,.14,edgeD)*smoothstep(.5,.9,c.r)*.26);float fold=line(fract((m+.02*n)*24.+.5)-.5,.013)*smoothstep(.45,.68,m)*(1.-smoothstep(.72,.95,m));tissue=mix(tissue,vec3(.94,.88,.71),fold*.22);tissue=mix(tissue,vec3(.98,.42,.63),exp(-abs(d- function shader(type,code){let s=gl.createShader(type);gl.shaderSource(s,code);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}function program(code){let p=gl.createProgram();gl.attachShader(p,shader(gl.VERTEX_SHADER,vertex));gl.attachShader(p,shader(gl.FRAGMENT_SHADER,code));gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));return {p,u:Object.fromEntries(['state','feed','size','simSize','aspect','time','dt','seed','first'].map(x=>[x,gl.getUniformLocation(p,x)]))}}

function prime(){for(const g of groups){g.x-=g.vx*8+.065*Math.sin(g.phase);g.y-=g.vy*8+.065*Math.cos(g.phase)}raster();step(1/60,true);for(const g of groups){g.x+=g.vx*8+.065*Math.sin(g.phase);g.y+=g.vy*8+.065*Math.cos(g.phase)}raster();step(1/60,2);render()}
function resize(){let w=innerWidth,h=innerHeight,dpr=Math.min(devicePixelRatio||1,1.5),ratio=Math.min(1,540/Math.min(w,h),960/Math.max(w,h));view.width=Math.max(1,Math.round(w*dpr));view.height=Math.max(1,Math.round(h*dpr));W=source.width=scratch.width=Math.max(2,Math.round(w*ratio));H=source.height=scratch.height=Math.max(2,Math.round(h*ratio));U=Math.min(W,H);for(const x of targets){gl.deleteTexture(x.x);gl.deleteFramebuffer(x.f)}if(src)gl.deleteTexture(src);src=tex(W,H,false);targets=[target(),target()];init();prime()}
function pass(o,w,h,first,dt){gl.useProgram(o.p);let u=o.u;gl.viewport(0,0,w,h);gl.uniform2f(u.size,w,h);gl.uniform2f(u.simSize,W,H);gl.uniform2f(u.aspect,W/U,H/U);gl.uniform1f(u.time,t);gl.uniform1f(u.seed,seed);gl.uniform1f(u.dt,dt);gl.uniform1f(u.first,Number(first));gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,targets[front].x);gl.uniform1i(u.state,0);gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,src);gl.uniform1i(u.feed,1);gl.drawArrays(gl.TRIANGLES,0,3)}
